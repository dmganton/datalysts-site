<h1>Authorisation received</h1>
<p>You can close this page. If you were asked to copy the code shown below, paste it into the setup script.</p>
<p><code id="code" style="word-break:break-all">No code in this address.</code></p>
<script>
  try {
    var p = new URLSearchParams(location.search);
    var c = p.get("code"), e = p.get("error");
    var el = document.getElementById("code");
    if (c) el.textContent = c; else if (e) el.textContent = "Error: " + e + " " + (p.get("error_description") || "");
  } catch (err) {}
</script>
